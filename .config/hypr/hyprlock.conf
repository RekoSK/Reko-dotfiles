# TIME
label {
    monitor =
    text = <span alpha='32768' foreground='orange'>$TIME</span>
    # The last number (0.5) makes it 50% transparent
     
    font_size = 120
    font_family = Inter Bold
    position = 0, -150
    halign = center
    valign = top
    
    # This adds a subtle "glow" or shadow to keep it readable 
    # even when transparent against bright wallpapers
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.2)
    shadow_boost = 1.2
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "<span alpha='32768' foreground='orange'>$(date +"%A, %d %B")</span>"
    font_size = 24
    font_family = Inter SemiBold
    position = 0, -130
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.2)
    shadow_boost = 1.2
}



# INPUT FIELD (Cleaner, more Apple-like)
input-field {
    monitor =
    size = 240, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 125, 0, 0.4)
    font_color = rgb(160, 80, 0)
    fade_on_empty = false
    rounding = 15
    placeholder_text =
    hide_input = false
    position = 0, -150
    halign = center
    valign = center
}

background {
    monitor =
    path = /home/reko/Pictures/waypaper/Nyarch_default_walpaper.webp
