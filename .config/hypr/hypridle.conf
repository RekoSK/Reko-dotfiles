general {
    lock_cmd = pidof hyprlock || hyprlock                                # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                             # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' # so the screen doesn't need a second key press after waking up.
}

# Keyboard backlight off after 30s, back on with activity (does nothing without one)
listener {
    timeout = 30
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

listener {
    timeout = 170                                                        # 2min 50s
    on-timeout = notify-send "Locking screen in 10..."
}

listener {
    timeout = 180                                                        # 3min
    on-timeout = loginctl lock-session                                   # lock the screen
}

listener {
    timeout = 300                                                        # 5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'     # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r   # screen back on with activity
}
