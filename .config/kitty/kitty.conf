# Font configuration (Use a Nerd Font for icons!)
font_family      JetBrainsMono Nerd Font
font_size        14.0

# Window Padding (Makes it look less cramped)
window_padding_width 15

# Transparency (Goes great with Hyprland blur)
background_opacity 0.20
background_blur 1

# The Amber/Orange Color Scheme
foreground            #ffa56a
background            #4f1500
selection_foreground  #1e1e2e
selection_background  #fab387

# This makes the cursor "trail" and slide instead of jumping
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# This makes the cursor shape feel more modern
cursor_shape beam
cursor_beam_thickness 1.5